apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-api

  template:
    metadata:
      labels:
        app: task-api

    spec:
      containers:
      - name: task-api
        image: task-api:1.0
        imagePullPolicy: Never

        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: task-api

spec:
  selector:
    app: task-api

  ports:
  - port: 8000
    targetPort: 8000

  type: NodePort