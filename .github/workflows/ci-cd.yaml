name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - feature/project-bootstrap

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build API Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/task-api:${{ github.sha }} -f services/api/Dockerfile .

    - name: Build Worker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/task-worker:${{ github.sha }} -f services/worker/Dockerfile .

    - name: Push API Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/task-api:${{ github.sha }}

    - name: Push Worker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/task-worker:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
    - name: Setup kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
    
    - name: Verify Cluster Access
      run: kubectl get nodes

    - name: Deploy API
      run: |
        kubectl set image deployment/task-api task-api=${{ secrets.DOCKER_USERNAME }}/task-api:${{ github.sha }} -n task-platform

    - name: Deploy Worker
      run: |
        kubectl set image deployment/task-worker task-worker=${{ secrets.DOCKER_USERNAME }}/task-worker:${{ github.sha }} -n task-platform